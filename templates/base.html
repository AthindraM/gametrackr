<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#161b22">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/site.webmanifest">
    <title>{% block title %}Gametrackr{% endblock %}</title>
    <link rel="stylesheet" href="{{ asset('css/style.css') }}">
    <script src="{{ asset('js/covers.js') }}"></script>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="logo" href="{{ url_for('home') }}">Game<span>trackr</span></a>

        <form class="navsearch" action="{{ url_for('search') }}" method="get" role="search">
          <span class="ac">
            <input type="search" name="q" placeholder="Search games" aria-label="Search games"
                   value="{{ request.args.get('q', '') if request.endpoint == 'search' else '' }}"
                   data-suggest="go" autocomplete="off" required>
          </span>
        </form>

        {% if user %}
          <a href="{{ url_for('add') }}">Add game</a>
          <details class="menu">
            <summary>{{ user.username }}</summary>
            <div class="pop">
              <a href="{{ url_for('profile', username=user.username) }}">Profile</a>
              <a href="{{ url_for('settings_index') }}">Settings</a>
              <hr>
              <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf" value="{{ csrf_token }}">
                <button class="danger">Log out</button>
              </form>
            </div>
          </details>
        {% else %}
          <a href="{{ url_for('login') }}">Log in</a>
          <a class="btn" href="{{ url_for('register') }}">Sign up</a>
        {% endif %}
      </div>
    </header>

    <main>
      {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
      {% block body %}{% endblock %}
    </main>

    <script src="{{ asset('js/app.js') }}" defer></script>
  </body>
</html>
