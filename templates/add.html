{% extends "base.html" %}
{% block title %}Add game - Gametrackr{% endblock %}

{% block body %}
  <h1>{{ "Edit your rating" if editing else "Add a game" }}</h1>
  <form class="stack" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    {# Filled in by the autocomplete when you pick a game from IGDB. #}
    <input type="hidden" id="igdb_id" name="igdb_id" value="{{ form.igdb_id }}">

    <label>Game title
      <span class="ac">
        <input name="title" value="{{ form.title }}" required maxlength="120"
               data-suggest="fill" data-igdb-field="igdb_id" autocomplete="off"
               {{ "readonly" if locked }} {{ "" if locked else "autofocus" }}>
      </span>
    </label>
    <label>Rating (1.0 - 10.0)
      <input type="number" name="rating" value="{{ form.rating }}"
             min="1" max="10" step="0.1" required>
    </label>
    <label>Review (optional)
      <textarea name="review" maxlength="5000">{{ form.review }}</textarea>
    </label>
    <button>Save</button>
  </form>
{% endblock %}
